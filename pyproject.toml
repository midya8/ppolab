[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ppolab"
version = "0.1.0"
description = "PPO from scratch in pure NumPy: clipped objective, GAE, and a CartPole built from first principles"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["numpy", "matplotlib", "pillow"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
